  <title id="title">Leaf — icône d’application V5 claire</title>
  <desc id="description">
    Une feuille émeraude nerveuse sur un carré beige clair.
  </desc>

  <defs>
    <!-- Palette claire Leaf : surface chaude et profondeur très contenue. -->
    <linearGradient id="background"
                    x1="0" y1="0" x2="1" y2="0"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="matrix(3350 3550 -3550 3350 466.667 350)">
      <stop offset="0" stop-color="#F0ECE3"/>
      <stop offset="0.52" stop-color="#E9E3D6"/>
      <stop offset="1" stop-color="#DED6C9"/>
    </linearGradient>

    <radialGradient id="aura"
                    cx="0" cy="0" r="1"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(2216.67 2083.33) scale(1900)">
      <stop offset="0" stop-color="#0A6A55" stop-opacity="0.25"/>
      <stop offset="0.42" stop-color="#0A6A55" stop-opacity="0.15"/>
      <stop offset="0.72" stop-color="#0A6A55" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0A6A55" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="leaf-fill"
                    x1="0" y1="0" x2="1" y2="0"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="matrix(2062.5 -2479.17 2479.17 2062.5 1150 3291.67)">
      <stop offset="0" stop-color="#0A6A55" stop-opacity="0.22"/>
      <stop offset="0.52" stop-color="#0A6A55" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0A6A55" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Variations construites autour de l'émeraude principale #0A6A55. -->
    <linearGradient id="leaf-ink"
                    x1="0" y1="0" x2="1" y2="0"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="matrix(2079.17 -2470.83 2470.83 2079.17 1133.33 3283.33)">
      <stop offset="0" stop-color="#075846"/>
      <stop offset="0.58" stop-color="#0A6A55"/>
      <stop offset="1" stop-color="#148169"/>
    </linearGradient>
  </defs>

