name: desktop

# Filtered by path, like every other block: touching the server or the tools must not
# rebuild the client. One workflow per block, and they never meet.
on:
  push:
    # main only, the way sonar already does it. A working branch runs everything below
    # through `pull_request` anyway, so subscribing to both ran every job twice on every
    # push — four duplicated jobs across this workflow and the server's. The
    # `pull_request` run is the one worth keeping: it builds the merge into main, where
    # this one builds the branch alone and would go on passing after main moved under it.
    branches: [main]
    paths:
      - 'desktop/**'
      # The client's types are hand-written from this file, so a change to it can break the
      # client without touching a line under desktop/. Without this path the one guard that
      # would notice never runs.
      - 'contract/openapi.yaml'
      - 'packaging/**'
      - 'VERSION'
      - 'install.sh'
      - 'tools/client_knows_the_contract.py'
      - 'tools/bytes_stay_utf8.py'
      - 'tools/words_stay_french.py'
      - 'tools/nothing_talks_to_the_console.py'
      - 'tools/text_stays_plain.py'
      - '.github/workflows/desktop.yml'
      - '.github/actions/qt/**'
  pull_request:
    paths:
      - 'desktop/**'
      - 'contract/openapi.yaml'
      - 'packaging/**'
      - 'VERSION'
      - 'install.sh'
      - 'tools/client_knows_the_contract.py'
      - 'tools/bytes_stay_utf8.py'
      - 'tools/words_stay_french.py'
      - 'tools/nothing_talks_to_the_console.py'
      - 'tools/text_stays_plain.py'
  workflow_dispatch:

# A push to a pull request replaces the one before it: the earlier run answers for a commit
# nobody will merge, and went on to the end all the same — on the day this was written, two
# pushes five minutes apart ran two complete analyses side by side, 26 and 37 minutes. A branch of
# `main` is never cancelled: its run is the record of what main held, and `run_id` keeps
# every one in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    # The distribution the client is written for. Qt comes from its packages rather than
    # from an installer, so what CI builds against is what the machine has.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: bash -n ../install.sh

      - name: install Qt 6 and the QML modules
        uses: ./.github/actions/qt

      # First, because a client that has fallen behind the contract compiles perfectly: it
      # simply stops reading a field somebody added. Nothing else in this workflow can see it.
      - name: the client still knows the contract
        working-directory: .
        run: |
          pip install pyyaml
          python3 tools/client_knows_the_contract.py

      # Warnings are errors here, as they are on the server. A codebase that learns to
      # ignore its warnings never unlearns it, and this block has one chance to say so.
      # The compiler's work, kept from one run to the next. Building the client took 671 s
      # of a 21-minute job, every push, though a push touches a few files out of two hundred.
      # Keyed by commit and restored from the closest one before it: a pull request reads
      # what main left, and what its own earlier pushes left.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-desktop-${{ github.sha }}
          restore-keys: ccache-desktop-

      # The counters travel with the cache and add up from one run to the next: a hit rate
      # read off the end of a run was the rate of every run since the cache began — 56 % in
      # the log where a rebuild of the same code, with every file's date renewed, measured
      # 98 %. Zeroed here, the figure below is this run's.
      - run: ccache --zero-stats

      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build build

      # Saved once the build is done, before the tests: a test that fails says nothing
      # against the objects, and the next push would otherwise compile everything again.
      # The hit rate is printed so that a cache which stopped hitting is seen, not guessed.
      - run: ccache --show-stats
      - uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-desktop-${{ github.sha }}

      # A runner has no keyring, so the fallback is the branch that runs there and the
      # keyring branch is the one that runs on a desktop. Between the two machines both are
      # exercised — which is why the file half is a plain function taking its own path,
      # rather than something reachable only by luck of environment.
      # `crosses-the-seam` is 359 cases in one binary and took 439 s of a 453 s ctest, alone. It is
      # cut into three shares (see desktop/CMakeLists.txt) that each open their own display, so
      # they run side by side; everything else stays serial, as before. A fourth test fails if
      # the shares stop adding up to every case.
      - run: xvfb-run -a ctest --test-dir build -R '^crosses-the-seam-[0-9]+$' -j3 --output-on-failure
      - run: xvfb-run -a ctest --test-dir build -E '^crosses-the-seam-[0-9]+$' --output-on-failure

      # Linking is not opening. The module's resource path moved between Qt 6.4 and 6.5, so
      # a build that links perfectly can still exit at once with nothing on screen.
      - run: tests/opens.sh build/leaf-desktop
