name: desktop

# Filtered by path, like every other block: touching the server or the tools must not
# rebuild the client. One workflow per block, and they never meet.
on:
  push:
    paths:
      - 'desktop/**'
      # The client's types are hand-written from this file, so a change to it can break the
      # client without touching a line under desktop/. Without this path the one guard that
      # would notice never runs.
      - 'contract/openapi.yaml'
      - 'tools/client_knows_the_contract.py'
      - 'tools/bytes_stay_utf8.py'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'contract/openapi.yaml'
      - 'tools/client_knows_the_contract.py'
      - 'tools/bytes_stay_utf8.py'
  workflow_dispatch:

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    # The distribution the client is written for. Qt comes from its packages rather than
    # from an installer, so what CI builds against is what the machine has.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install Qt 6 and the QML modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build qt6-base-dev qt6-declarative-dev libqt6svg6-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript qtkeychain-qt6-dev

      # First, because a client that has fallen behind the contract compiles perfectly: it
      # simply stops reading a field somebody added. Nothing else in this workflow can see it.
      - name: the client still knows the contract
        working-directory: .
        run: |
          pip install pyyaml
          python3 tools/client_knows_the_contract.py

      # Warnings are errors here, as they are on the server. A codebase that learns to
      # ignore its warnings never unlearns it, and this block has one chance to say so.
      - run: cmake -S . -B build -G Ninja
      - run: cmake --build build

      # A runner has no keyring, so the fallback is the branch that runs there and the
      # keyring branch is the one that runs on a desktop. Between the two machines both are
      # exercised — which is why the file half is a plain function taking its own path,
      # rather than something reachable only by luck of environment.
      - run: ctest --test-dir build --output-on-failure

      # Linking is not opening. The module's resource path moved between Qt 6.4 and 6.5, so
      # a build that links perfectly can still exit at once with nothing on screen.
      - run: tests/opens.sh build/leaf-desktop
