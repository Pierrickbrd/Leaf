[package]
name = "leaf-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "A reading server for a comics library."

[dependencies]
# HTTP. axum for the routing, tokio for the runtime — and the database deliberately
# outside both, see store::db.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["trace"] }
# Reading a request body frame by frame: an upload goes to the disk as it arrives rather
# than being buffered whole, which at 130 MB a volume is the difference that matters.
http-body-util = "0.1"
# And the same sentence in the other direction. `ReaderStream` is the only thing taken from
# it: a download that read the file whole first held a volume in memory per reader, which is
# a server that falls over at three of them and cannot serve a large one at all.
tokio-util = { version = "0.7", features = ["io"] }

# SQLite, compiled in: no system library, so there is nothing to install beside the binary.
# `collation` registers the ORDER BY a French library needs: SQLite's own are ASCII, so
# « Élève » sorted after « Zorro ». Pure Rust, no extra C, and nothing stored depends on it.
rusqlite = { version = "0.37", features = ["bundled", "collation"] }

# A CBZ is a renamed zip. Entries are read by name over Read + Seek, which is the ZipFile
# model rather than the sequential one.
zip = { version = "6", default-features = false, features = ["deflate"] }
# Decode JPEG, PNG, GIF, BMP, WebP; dimensions without decoding. AVIF and HEIC are not
# supported: reading them would mean a C dependency, and the point of this list is that
# there is none.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
# SIMD resize. Measured on a real page: 1.9 ms against 31 ms for the scalar one in
# `image` — sixteen times, on the one step of the path that was never the bottleneck.
fast_image_resize = { version = "5", features = ["image"] }
# Lossy WebP for a resized page, at the fidelity of the JPEG it replaces for 0.56 of its
# bytes — measured on 177 real pages, equal PSNR and a higher SSIM. And a resize that comes
# out larger than its WebP source, which was 32 to 54 % of them as JPEG, is 0 %. `image`
# only writes lossless WebP, so this is libwebp: compiled from source by `cc`, linked
# statically, still nothing to install beside the binary — only a C compiler to build it.
webp = { version = "0.3", default-features = false }
# JPEG, only for a page too tall for a WebP — a webtoon strip past 16 383 rows at its
# reading width. Measured on a 1936×1400 page: 6.3 ms to encode against 18.4 for the one in
# `image`, in Rust with SIMD, for the same size and fidelity.
jpeg-encoder = { version = "0.7", features = ["simd"] }

# ComicInfo.xml. Not a courtesy: the real library is 100 %% ComicInfo and 0 %% entry.json,
# and this is the only reader for its 2 677 chapters. External entities are not resolved at
# all, which is what a general-purpose XML parser has to be asked for explicitly.
quick-xml = "0.38"

# NFD, to strip an accent from any letter rather than from the ones a table remembered.
# "Haikyū" folded to "haiky" with a hand-written table, which is the kind of bug that
# quietly returns nothing.
unicode-normalization = "0.1"

# Repeated query parameters — ?author=a&author=b — which serde_urlencoded cannot express
# as a Vec, and which is the whole mechanism of the filters.
form_urlencoded = "1"

serde = { version = "1", features = ["derive"] }
# `preserve_order`, because a sidecar is a file a person edits. Without it every
# write sorts the keys, and a hand-written field comes back three lines from where
# its author put it — a diff across a whole library for a change nobody made.
serde_json = { version = "1", features = ["preserve_order"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }

# One hash for the whole server: identities derived from a path, cache file names, the
# constant-time key comparison, and the checksum an import is verified against. SHA-1 was
# here for the first two until nothing in the index depended on it yet — which was the last
# moment it could be changed for free.
sha2 = "0.10"

# A device key and a link code are drawn from the system's own randomness, and from nothing
# seeded by the process: a key that can be predicted is a library anyone can read.
getrandom = "0.3"
# The key goes to the client as base64url without padding — 43 characters for 32 bytes,
# safe in a header, a keychain entry and a JSON string alike.
base64 = "0.22"

thiserror = "2"
anyhow = "1"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rcgen = { version = "0.14.9", default-features = false, features = ["pem", "ring"] }
rustls-pemfile = "2.2.0"
# The system's own trust store, for one question only: whether the certificate an address
# presents is one every client already trusts (Let's Encrypt behind a proxy), in which case a
# link carries no fingerprint — it would change every ninety days.
rustls-native-certs = "0.8"
# `device add` prints its link as a QR code in the terminal, to be scanned by a phone rather
# than typed. Without its image features: text is the only thing drawn here.
qrcode = { version = "0.14", default-features = false }
# The addresses of the machine, for a server bound to every interface: one link per address
# it can actually be reached on, rather than `0.0.0.0`, which no client can dial.
if-addrs = "0.13"

[target.'cfg(unix)'.dependencies]
# `device` commands run under sudo and must give up root for the database owner's account
# before opening it (`cli::become_owner`), and `device list` prints local times: setgid,
# setuid, localtime_r — nothing in the standard library does any of the three. Also what the
# tests use to send the binary the signal a unit file would.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Only to hand a route a body that arrives in pieces, which is the shape the real one has.
futures-util = "=0.3.31"
zip = { version = "6", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tower = { version = "0.5", features = ["util"] }

# Line tables instead of full DWARF. A backtrace still names the file and the line, which
# is all a panic here is ever read for, and the debug tree drops from 2.9 GB to a third of
# that — it is the largest thing on this disk by an order of magnitude.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
