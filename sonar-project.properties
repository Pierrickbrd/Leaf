sonar.projectKey=Pierrickbrd_Leaf
sonar.organization=pierrickbrd

# What ships, and the guards that hold it together. Build trees are output, fonts and
# logos are not code, and the analyser has nothing to say about either.
sonar.sources=server/src,desktop/src,desktop/qml,tools
sonar.tests=server/tests,desktop/tests,tools/test_scan_bench.py,tools/test_from_tomes_json.py
# The Python test sits inside `tools`, which is a source root, so it has to be taken out
# of the sources explicitly — a file declared as both source and test stops the analysis
# outright rather than being resolved one way or the other.
sonar.exclusions=**/*.ttf,**/*.svg,server/target/**,desktop/build/**,desktop/coverage/**,tools/test_*.py

# Rust: the analyser reads the manifest itself. Clippy's findings are handed to it as a
# report rather than left for it to guess at a second time — the build already runs clippy
# with warnings as errors, so this costs nothing beyond writing the output down.
sonar.rust.cargo.manifestPaths=server/Cargo.toml
sonar.rust.clippyReport.reportPaths=clippy.json

# Which lines the tests reach. Without these the analyser counts the lines it could cover
# and reports nothing covering them — 0 %, from a repository whose tests each exist because
# something in them was once wrong. The C++ arrives in the generic format because that is
# what gcovr writes; the other two have a reader of their own.
sonar.rust.lcov.reportPaths=lcov.info
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverageReportPaths=coverage-cpp.xml

# The one rule that is wrong about this repository, and only about one file of it.
#
# `cpp:S2479` refuses a non-breaking space inside a string literal, and it is right almost
# everywhere: a U+00A0 in source is nearly always a copy-paste out of a word processor,
# invisible and unintended. `desktop/src/Words.h` opens by stating the opposite — « a
# non-breaking space before `: ; ! ?` and inside « … » » — and `Words.cpp` is the one file
# whose job is to hold those spaces. `tools/words_stay_french.py` runs under `ctest` and
# **refuses** a literal that is missing one, so the two would contradict each other on every
# commit: one demanding the character, the other demanding it be removed.
#
# Scoped to that file and to that rule. Anywhere else, a non-breaking space is the accident
# the rule describes, and it is still refused.
sonar.issue.ignore.multicriteria=nbsp
sonar.issue.ignore.multicriteria.nbsp.ruleKey=cpp:S2479
sonar.issue.ignore.multicriteria.nbsp.resourceKey=desktop/src/Words.cpp

sonar.sourceEncoding=UTF-8
